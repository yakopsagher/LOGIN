<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title> login </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h2>ENTER YOUR INFORMATOIN</h2>

    <!-- المعلومات الشخصية -->
    <div class="section">
      <h3> personal information</h3>
      <div class="field"><input type="text" required><label>FULL NAME</label></div>
      <div class="field"><input type="text" required><label>FATHER NAME</label></div>
      <div class="field"><input type="text" required><label>MOTHER NAME</label></div>
      <div class="field"><input type="text" required><label>GENDER</label></div>
      <div class="field"><input type="text" required><label>UNIVERSITY NAMBER</label></div>
    </div>
  </div>
  <br>
    <!-- معلومات الاتصال -->
    <div class="form-container">
    <div class="section">
      <h3>contact information </h3>
      <div class="field"><input type="tel" required><label>PHONE NUMBER</label></div>
      <div class="field"><input type="email" required><label>EMAIL</label></div>
      <div class="field"><input type="text" required><label>YOUR ADRESS</label></div>
      <div class="field"><input type="text" required><label>COUNTRY</label></div>
      <div class="field"><input type="text" required><label>CITY</label></div>
    </div>
    </div>
<br>
    <!-- معلومات الدراسة -->
    <div class="form-container">
    <div class="section">
      <h3> studies information</h3>
      <div class="field"><input type="text" required><label>YPUR BRACH</label></div>
      <div class="field"><input type="text" required><label>OVERALL AVERAGE</label></div>
      <div class="field"><input type="text" required><label>HIGH SCHOOL AVERAGE</label></div>
      <div class="field"><input type="text" required><label>SOURCE OR CERTIFICATE</label></div>
      <div class="field"><input type="text" required><label>SUBSCRIPYION NUMBER</label></div>
    </div>
    </div>
    <br>
  <button class="submit-button">enter</button>
  </div>
</body>
</html>
